apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: equipment-booking
  template:
    metadata:
      labels:
        app: equipment-booking
    spec:
      containers:
      - name: equipment-booking
        image: campus-equipment-booking:set-f
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
spec:
  type: NodePort
  selector:
    app: equipment-booking
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30085